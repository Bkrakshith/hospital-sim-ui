<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>G1 Hospital Console</title>
  <link rel="icon" href="img/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/app.css">
  <script>
    // apply the saved theme before first paint
    try {
      const t = localStorage.getItem('g1.theme');
      if (t) document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>
</head>
<body>
  <div id="app">
    <header class="topbar">
      <button class="icon-btn" id="nav-toggle" title="Menu" aria-label="Toggle menu">
        <svg viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
      </button>
      <div class="brand">
        <img src="img/icon.svg" alt="" width="26" height="26">
        <div>
          <div class="brand-name">G1 Console</div>
          <div class="brand-sub">Surgical wing · Unitree G1</div>
        </div>
      </div>
      <div class="crumb" id="page-title">Dashboard</div>
      <div class="topbar-center">
        <span class="pill" id="conn-pill"><span class="dot"></span><span class="txt">connecting</span></span>
        <span class="mode-badge" id="mode-badge" data-mode="none">NO MODE</span>
        <span class="pill" id="nav-pill" hidden></span>
      </div>
      <div class="topbar-right">
        <span class="pill subtle" id="mock-pill" hidden title="Server started with --mock">MOCK ROBOT</span>
        <span class="pill subtle" id="batt-pill" title="Battery">
          <svg viewBox="0 0 24 24" class="ico"><rect x="2" y="7" width="18" height="10" rx="2"/><path d="M22 11v2"/></svg>
          <span class="txt">--</span>
        </span>
        <button class="icon-btn" id="theme-toggle" title="Toggle light / dark" aria-label="Toggle theme">
          <svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        </button>
        <button class="estop" id="estop" title="Emergency stop: any mode -> DAMP (key x)">
          <span class="estop-ring"></span>E-STOP
        </button>
      </div>
    </header>

    <nav class="sidebar" id="sidebar">
      <a href="#/dashboard" data-page="dashboard">
        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg>
        <span>Dashboard</span></a>
      <a href="#/mapping" data-page="mapping">
        <svg viewBox="0 0 24 24"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2z"/><path d="M9 4v14M15 6v14"/></svg>
        <span>Mapping</span></a>
      <a href="#/navigation" data-page="navigation">
        <svg viewBox="0 0 24 24"><path d="M12 2 4 21l8-4 8 4-8-19z"/></svg>
        <span>Navigation</span></a>
      <a href="#/teleop" data-page="teleop">
        <svg viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="11" rx="4"/><path d="M7 11v3M5.5 12.5h3"/><circle cx="16" cy="11.5" r="1"/><circle cx="18" cy="13.5" r="1"/></svg>
        <span>Teleoperation</span></a>
      <a href="#/mission" data-page="mission">
        <svg viewBox="0 0 24 24"><path d="M9 4h6M10 4v3M14 4v3"/><rect x="5" y="7" width="14" height="13" rx="2"/><path d="M9 12l2 2 4-4"/></svg>
        <span>Mission</span></a>
      <a href="#/logs" data-page="logs">
        <svg viewBox="0 0 24 24"><path d="M4 5h16M4 10h16M4 15h10M4 20h7"/></svg>
        <span>Logs</span></a>
      <div class="sidebar-foot" id="sidebar-foot"></div>
    </nav>

    <main id="main"></main>
    <div id="toasts" aria-live="polite"></div>
    <div id="conn-banner" hidden>Connection to the robot server lost. Reconnecting…</div>
  </div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
