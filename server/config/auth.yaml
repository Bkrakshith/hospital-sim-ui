    pin: "pbkdf2_sha256$120000$daa04ef84720c62f$b8f420cb1dd3082646c5c42b7abc382fee2f2732cbdf4c40298e7bc1948be195"
    idle_timeout_s: 300       # back to clinical after 5 min idle
    two_factor: false         # true = personal badge + PIN (04 §3); false while testing
