    pin: "pbkdf2_sha256$120000$27e0fac5ae0b64e4$66c4e5dc2958f98f5aff58500e71fefbf764115ffd546f0818b51ddab6c94500"
    idle_timeout_s: 600       # back to clinical after 10 min idle
