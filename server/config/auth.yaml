# Change a role PIN:  python hospital-sim-ui/server/auth.py set-pin operator <new pin>   ·   hash only: auth.py hash <pin>
roles:
  clinical:
    pin: null                 # walk-up-and-use (set a 4-digit ward PIN hash here to require one)
    idle_timeout_s: 0         # never exits (the app locks to tap-to-wake after 2 min)
